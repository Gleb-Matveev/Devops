<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
</head>
<body>
  <main>
    <header>
      <h1>Notes</h1>
      <span id="status" class="badge">…</span>
    </header>

    <form id="note-form">
      <input id="note-text" type="text" placeholder="Новая заметка" maxlength="500" required autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <p id="error" class="error" hidden></p>
    <ul id="notes"></ul>
    <p id="empty" class="muted" hidden>Пока нет заметок</p>

    <footer id="info" class="muted">backend: …</footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
